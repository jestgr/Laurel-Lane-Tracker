<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Laurel Lane — Project Command</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c0e; --surface:#111416; --surface2:#181c1f; --surface3:#1e2428;
  --border:#2a3038; --border2:#3a4450;
  --text:#c8d4dc; --text-dim:#6a7f8e; --text-bright:#e8f0f5;
  --accent:#c55a11; --accent2:#e07030;
  --green:#2d9e6e; --green-dim:#1a5c40;
  --blue:#2e6da4; --blue-bright:#4a9fd4;
  --yellow:#c8a020; --red:#a03030;
  --mono:'Share Tech Mono',monospace;
  --cond:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
  --shadow:none;
  --theme-icon:'☀';
}
html.light {
  --bg:#f0f2f4; --surface:#ffffff; --surface2:#f7f8fa; --surface3:#edf0f3;
  --border:#d0d8e0; --border2:#b0bcc8;
  --text:#2a3a4a; --text-dim:#7a8fa0; --text-bright:#0f1e2e;
  --accent:#c55a11; --accent2:#a84a0e;
  --green:#1e7a52; --green-dim:#c8eedc;
  --blue:#2060a0; --blue-bright:#1a5090;
  --yellow:#8a6a00; --red:#902020;
  --shadow:0 1px 4px rgba(0,0,0,.10);
  --theme-icon:'🌙';
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;min-height:100vh;transition:background .2s,color .2s;}
/* Light mode specific overrides */
html.light .ci{box-shadow:var(--shadow);}
html.light .cc{box-shadow:var(--shadow);}
html.light .nc{box-shadow:var(--shadow);}
html.light .log-entry{box-shadow:var(--shadow);}
html.light .substep:hover{background:rgba(0,0,0,.03);}
html.light .ci-contact{background:rgba(46,109,164,.07);}
html.light .modal-overlay-bg{background:rgba(0,0,0,.5);}
html.light .notice{background:#f0f4f8;border-left-color:var(--blue);}
html.light .callout-box{background:#fff8f0;}
html.light .md-task-ref{background:rgba(197,90,17,.06);}
html.light .phase-tag{background:rgba(197,90,17,.08);}
/* Theme toggle button */
.theme-btn{font-family:var(--mono);font-size:12px;padding:4px 10px;background:none;border:1px solid var(--border2);color:var(--text-dim);cursor:pointer;transition:all .15s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent2);}
/* HEADER */
.header{background:var(--surface);border-bottom:2px solid var(--accent);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;gap:12px;}
.hdr-title{font-family:var(--cond);font-weight:900;font-size:20px;letter-spacing:3px;text-transform:uppercase;color:var(--text-bright);white-space:nowrap;}
.hdr-sub{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:2px;white-space:nowrap;}
.hdr-stats{font-family:var(--mono);font-size:11px;color:var(--text-dim);display:flex;gap:16px;flex-wrap:wrap;}
.sv{color:var(--accent2);font-weight:bold;}
/* NAV */
.nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 12px;overflow-x:auto;}
.nav-btn{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--accent2);border-bottom-color:var(--accent);}
/* MAIN */
.main{padding:16px;max-width:1100px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}
/* PHASE */
.phase-hdr{display:flex;align-items:center;gap:10px;margin:24px 0 8px;cursor:pointer;user-select:none;}
.phase-hdr:first-child{margin-top:0;}
.phase-tag{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--accent);background:rgba(197,90,17,.12);border:1px solid rgba(197,90,17,.3);padding:3px 7px;white-space:nowrap;}
.phase-title{font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--text-bright);flex:1;}
.phase-prog{font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap;}
.phase-arrow{font-size:11px;color:var(--text-dim);transition:transform .2s;}
.phase-hdr.col .phase-arrow{transform:rotate(-90deg);}
.phase-line{height:1px;background:linear-gradient(90deg,var(--accent) 0%,var(--border) 60%,transparent 100%);margin-bottom:6px;}
.prog-bar{height:2px;background:var(--border);margin-bottom:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green));transition:width .3s ease;}
.phase-body.col{display:none;}
/* SECTION */
.sec-hdr{display:flex;align-items:center;gap:8px;margin:14px 0 5px;padding-left:8px;border-left:2px solid var(--blue);}
.sec-title{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--blue-bright);flex:1;}
.add-task-btn{font-family:var(--mono);font-size:10px;padding:2px 8px;background:none;border:1px solid var(--border2);color:var(--text-dim);cursor:pointer;transition:all .15s;}
.add-task-btn:hover{border-color:var(--accent);color:var(--accent2);}
/* CHECK ITEM */
.ci{display:flex;align-items:flex-start;gap:8px;padding:8px 8px 8px 10px;border:1px solid var(--border);background:var(--surface2);margin-bottom:2px;transition:background .15s;}
.ci:hover{background:var(--surface3);}
.ci.done{opacity:.5;}
.ci.done .ci-text{text-decoration:line-through;color:var(--text-dim);}
.ci.gate-item{border-left:3px solid var(--red);}
.ci.gate-item.done{border-left-color:var(--green);}
.cb{width:18px;height:18px;border:1px solid var(--border2);background:var(--bg);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.ci.done .cb{background:var(--green-dim);border-color:var(--green);}
.ck{color:var(--green);font-size:11px;display:none;}
.ci.done .ck{display:block;}
.ci-body{flex:1;min-width:0;}
.gate-lbl{font-family:var(--mono);font-size:9px;color:var(--red);letter-spacing:1px;margin-bottom:1px;}
.ci.done .gate-lbl{color:var(--green);}
.ci-text{color:var(--text);line-height:1.4;font-size:13px;}
.ci-note{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:3px;line-height:1.4;}
.ci-note::before{content:'→ ';color:var(--accent);}
.ci-usernote{font-size:12px;color:var(--yellow);margin-top:3px;font-style:italic;line-height:1.4;}
.ci-usernote::before{content:'✎ ';}
.ci-hours{font-family:var(--mono);font-size:10px;color:var(--green);margin-top:2px;}
.ci-hours::before{content:'⏱ ';}
.ci-contact{display:flex;align-items:center;gap:8px;margin-top:6px;margin-left:0;padding:5px 8px 5px 10px;background:rgba(46,109,164,.08);border-left:2px solid var(--blue-bright);position:relative;}
.ci-contact-icon{font-size:14px;color:var(--blue-bright);flex-shrink:0;}
.ci-contact-body{flex:1;min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px;}
.ci-contact-name{font-family:var(--cond);font-weight:700;font-size:14px;color:var(--text-bright);letter-spacing:.3px;white-space:nowrap;}
.ci-contact-sep{color:var(--border2);font-size:11px;}
.ci-contact-org{font-family:var(--mono);font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-contact-phone{font-family:var(--mono);font-size:10px;color:var(--blue-bright);margin-left:4px;white-space:nowrap;}
/* MOVE BUTTONS */
.ia-move{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;cursor:pointer;font-size:10px;transition:all .15s;color:var(--border2);flex-shrink:0;}
.ia-move:hover{border-color:var(--border2);color:var(--text);background:var(--surface);}
.ci-move{display:flex;flex-direction:column;gap:1px;align-self:center;flex-shrink:0;}
/* SUBSTEPS */
.substep-list{margin-left:0;margin-top:4px;border-left:2px solid var(--border);padding-left:0;}
.substep{display:flex;align-items:center;gap:6px;padding:4px 8px;background:transparent;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.substep:last-child{border-bottom:none;}
.substep:hover{background:rgba(255,255,255,.03);}
.substep.done .ss-text{text-decoration:line-through;color:var(--text-dim);}
.ss-cb{width:13px;height:13px;border:1px solid var(--border2);background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--green);}
.substep.done .ss-cb{background:var(--green-dim);border-color:var(--green);}
.ss-text{font-size:12px;color:var(--text);flex:1;line-height:1.3;}
.ss-edit-btn{font-size:10px;color:var(--border2);background:none;border:none;cursor:pointer;padding:0 3px;opacity:0;transition:opacity .15s;line-height:1;}
.substep:hover .ss-edit-btn,.substep:hover .ss-del{opacity:1;}
.ss-del{font-size:12px;color:var(--border2);background:none;border:none;cursor:pointer;padding:0 3px;opacity:0;transition:opacity .15s;line-height:1;}
.ss-del:hover{color:var(--red);}
.ss-edit-btn:hover{color:var(--accent2);}
.ss-inline-edit{display:flex;gap:4px;padding:4px 8px;border-bottom:1px solid var(--border);background:var(--bg);}
.ss-inline-input{flex:1;background:var(--surface2);border:1px solid var(--accent);color:var(--text-bright);padding:4px 7px;font-family:var(--body);font-size:12px;outline:none;}
.ss-inline-save{font-family:var(--mono);font-size:10px;padding:3px 8px;background:rgba(197,90,17,.2);border:1px solid var(--accent);color:var(--accent2);cursor:pointer;}
.ss-inline-cancel{font-family:var(--mono);font-size:10px;padding:3px 8px;background:none;border:1px solid var(--border2);color:var(--text-dim);cursor:pointer;}
.add-substep-row{display:flex;align-items:center;gap:0;margin-top:3px;border-left:2px solid var(--border);}
.add-substep-inp{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);padding:4px 8px;font-family:var(--body);font-size:12px;outline:none;display:none;}
.add-substep-inp:focus{border-bottom-color:var(--accent);}
.add-substep-inp.open{display:block;}
.add-substep-btn{font-family:var(--mono);font-size:10px;color:var(--text-dim);background:none;border:none;cursor:pointer;padding:4px 8px;display:block;transition:color .15s;}
.add-substep-btn:hover{color:var(--accent2);}
/* TASK ACTION ICONS */
.ci-actions{display:flex;gap:4px;flex-shrink:0;align-items:flex-start;padding-top:1px;}
.ia{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;cursor:pointer;font-size:14px;transition:all .15s;color:var(--text-dim);flex-shrink:0;}
.ia:hover{border-color:var(--border2);color:var(--text-bright);background:var(--surface);}
.ia.has-note{color:var(--yellow);}
.ia.has-log{color:var(--green);}
/* CONTACTS */
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
.cc{background:var(--surface2);border:1px solid var(--border);padding:14px;transition:border-color .15s;}
.cc:hover{border-color:var(--border2);}
.cc-name{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--text-bright);}
.cc-role{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.cc-details{margin-top:10px;display:flex;flex-direction:column;gap:3px;}
.cc-row{display:flex;gap:8px;align-items:flex-start;font-size:12px;}
.cc-lbl{font-family:var(--mono);font-size:10px;color:var(--text-dim);width:44px;flex-shrink:0;padding-top:1px;}
.cc-val{color:var(--text);word-break:break-all;}
.cc-val a{color:var(--blue-bright);text-decoration:none;}
.cc-val a:hover{text-decoration:underline;}
.cc-note{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim);font-style:italic;line-height:1.5;}
.cc-acts{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);}
/* NOTES */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
.nc{background:var(--surface2);border:1px solid var(--border);padding:14px;}
.nc-tag{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px;}
.nc-title{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--text-bright);margin-bottom:8px;}
.nc-body{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.nc-url{color:var(--blue-bright);text-decoration:none;font-size:12px;word-break:break-all;}
.nc-url:hover{text-decoration:underline;}
.nc-date{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:8px;padding-top:6px;border-top:1px solid var(--border);}
.nc-acts{display:flex;gap:6px;margin-top:8px;}
/* HOURS LOG */
.log-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.ls-card{background:var(--surface2);border:1px solid var(--border);padding:14px;text-align:center;}
.ls-num{font-family:var(--cond);font-size:36px;font-weight:900;color:var(--accent2);line-height:1;margin-bottom:3px;}
.ls-lbl{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;}
.log-entry{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);background:var(--surface2);margin-bottom:3px;align-items:flex-start;}
.le-date{font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap;min-width:80px;}
.le-hours{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--accent2);white-space:nowrap;min-width:50px;text-align:right;}
.le-body{flex:1;min-width:0;}
.le-task{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:1px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.le-loc{font-family:var(--mono);font-size:10px;color:var(--blue-bright);margin-bottom:2px;}
.le-type{font-family:var(--mono);font-size:10px;color:var(--text-dim);display:inline-block;border:1px solid var(--border2);padding:1px 5px;margin-bottom:4px;}
.le-desc{font-size:12px;color:var(--text);line-height:1.4;}
.le-acts{flex-shrink:0;display:flex;gap:4px;}
/* BUTTONS */
.btn{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;background:var(--surface);border:1px solid var(--border2);color:var(--text-dim);cursor:pointer;transition:all .15s;}
.btn:hover{color:var(--text-bright);border-color:var(--accent);}
.btn-p{background:rgba(197,90,17,.15);border-color:var(--accent);color:var(--accent2);}
.btn-p:hover{background:rgba(197,90,17,.3);color:var(--text-bright);}
.btn-d{border-color:var(--red);color:var(--red);}
.btn-d:hover{background:rgba(160,48,48,.2);}
.btn-sm{padding:3px 8px;font-size:10px;}
/* FILTER/ADD BAR */
.add-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-inp{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;font-family:var(--mono);font-size:12px;width:180px;outline:none;}
.search-inp:focus{border-color:var(--accent);}
.search-inp::placeholder{color:var(--text-dim);}
.fbtn{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .15s;}
.fbtn:hover{color:var(--text);}
.fbtn.active{background:rgba(197,90,17,.15);border-color:var(--accent);color:var(--accent2);}
/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:16px;}
.mo.open{display:flex;}
.md{background:var(--surface2);border:1px solid var(--border2);border-top:2px solid var(--accent);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:20px;}
.md-lg{max-width:620px;}
.md-title{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:2px;text-transform:uppercase;color:var(--text-bright);margin-bottom:16px;}
.md-task-ref{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:1px;margin-bottom:14px;padding:6px 10px;background:rgba(197,90,17,.08);border-left:2px solid var(--accent);}
.fg{margin-bottom:12px;}
.fl{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:4px;}
.fi,.fta,.fsel{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text-bright);padding:8px 10px;font-family:var(--body);font-size:13px;outline:none;transition:border-color .15s;}
.fi:focus,.fta:focus,.fsel:focus{border-color:var(--accent);}
.fta{min-height:70px;resize:vertical;}
.fsel{cursor:pointer;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.md-acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
/* EMPTY */
.empty{text-align:center;padding:40px 24px;color:var(--text-dim);font-family:var(--mono);font-size:12px;letter-spacing:1px;}
/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="hdr-title">LAUREL LANE</div>
    <div class="hdr-sub">PROJECT COMMAND</div>
  </div>
  <div class="hdr-stats">
    <span>TASKS <span class="sv" id="sDone">0</span>/<span class="sv" id="sTotal">0</span></span>
    <span>HRS <span class="sv" id="sHours">0</span></span>
    <span>CONTACTS <span class="sv" id="sCont">0</span></span>
  </div>
</div>
<div class="nav">
  <button class="nav-btn active" onclick="switchTab('checklist',this)">&#9632; Checklist</button>
  <button class="nav-btn" onclick="switchTab('hours',this)">&#9632; Hours Log</button>
  <button class="nav-btn" onclick="switchTab('contacts',this)">&#9632; Contacts</button>
  <button class="nav-btn" onclick="switchTab('notes',this)">&#9632; Notes &amp; Links</button>
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 8px;">
    <button class="btn btn-sm btn-p" onclick="exportAllData()" title="Export full backup as JSON">&#8681; BACKUP</button>
    <button class="btn btn-sm" onclick="triggerImport()" title="Restore from backup JSON">&#8679; RESTORE</button>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle light/dark theme">☀ LIGHT</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importAllData(event)">
  </div>
</div>
<div class="main">

<!-- CHECKLIST -->
<div class="panel active" id="panel-checklist">
  <div class="add-bar">
    <input class="search-inp" id="ckSearch" placeholder="SEARCH TASKS..." oninput="renderChecklist()">
    <div style="margin-left:auto;display:flex;gap:5px;">
      <button class="fbtn active" id="fa" onclick="setFilter('all',this)">ALL</button>
      <button class="fbtn" id="fo" onclick="setFilter('open',this)">OPEN</button>
      <button class="fbtn" id="fd" onclick="setFilter('done',this)">DONE</button>
    </div>
  </div>
  <div id="ckContainer"></div>
</div>

<!-- HOURS LOG -->
<div class="panel" id="panel-hours">
  <div class="add-bar">
    <button class="btn btn-p" onclick="openLogModal(null)">+ LOG TIME</button>
    <input class="search-inp" id="logSearch" placeholder="SEARCH LOG..." oninput="renderLog()" style="margin-left:8px;">
    <div style="margin-left:auto;display:flex;gap:5px;">
      <button class="fbtn active" id="lfa" onclick="setLogFilter('all',this)">ALL</button>
      <button class="fbtn" id="lfp" onclick="setLogFilter('phase',this)">BY PHASE</button>
    </div>
    <button class="btn btn-sm" onclick="exportLog()" style="margin-left:4px;" title="Export log as CSV">&#8681; CSV</button>
    <button class="btn btn-sm" onclick="exportTaxReport()" style="margin-left:4px;" title="Export formatted tax report">&#8681; TAX REPORT</button>
  </div>
  <div class="log-summary" id="logSummary"></div>
  <div id="logContainer"></div>
</div>

<!-- CONTACTS -->
<div class="panel" id="panel-contacts">
  <div class="add-bar">
    <button class="btn btn-p" onclick="openContactModal()">+ ADD CONTACT</button>

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Get all items (built-in + custom) for a section
function getSectionItems(phaseId, secId){
  const ph=PHASES.find(p=>p.id===phaseId);
  const sec=ph?.sections.find(s=>s.id===secId);
  const base=(sec?.items||[]).map(i=>({...i,_builtin:true}));
  const custom=(S.customTasks[secId]||[]).map(i=>({...i,_builtin:false}));
  const all=[...base,...custom];
  const order=S.itemOrder[secId];
  if(!order)return all;
  const indexed=Object.fromEntries(all.map(i=>[i.id,i]));
  const ordered=order.map(id=>indexed[id]).filter(Boolean);
  const remaining=all.filter(i=>!order.includes(i.id));
  return [...ordered,...remaining];
}

function moveItem(secId,itemId,dir){
  const ph=PHASES.find(p=>p.sections.some(s=>s.id===secId));
  if(!ph)return;
  const items=getSectionItems(ph.id,secId);
  const ids=items.map(i=>i.id);
  const idx=ids.indexOf(itemId);
  if(idx===-1)return;
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=ids.length)return;
  [ids[idx],ids[swapIdx]]=[ids[swapIdx],ids[idx]];
  S.itemOrder[secId]=ids;
  saveAll();renderChecklist();
}

// Get item text (may be overridden)
function getItemText(item){
  return (S.itemNotes[item.id+'__text'])||item.text;
}
function getItemHint(item){
  return (S.itemHints[item.id]!==undefined?S.itemHints[item.id]:item.note)||'';
}
function getUserNote(item){
  return S.itemNotes[item.id]||'';
}

// Hours for a task
function taskHours(itemId){
  return S.workLog.filter(e=>e.taskId===itemId).reduce((a,e)=>a+(+e.hours||0),0);
}

// Total hours
function totalHours(){
  return S.workLog.reduce((a,e)=>a+(+e.hours||0),0);
}

// Find item by id across all phases
function findItem(id){
  for(const ph of PHASES){
    for(const sec of ph.sections){
      const found=sec.items.find(i=>i.id===id);
      if(found)return{item:found,phase:ph,section:sec};
      const cf=(S.customTasks[sec.id]||[]).find(i=>i.id===id);
      if(cf)return{item:cf,phase:ph,section:sec};
    }
  }
  return null;
}

function renderChecklist(){
  const q=(document.getElementById('ckSearch').value||'').toLowerCase();
  const cont=document.getElementById('ckContainer');
  let html='',totalD=0,totalA=0;

  PHASES.forEach(ph=>{
    let phD=0,phA=0,phHtml='';
    ph.sections.forEach(sec=>{
      const items=getSectionItems(ph.id,sec.id);
      let secHtml='';
      items.forEach(item=>{
        const isDone=!!S.checked[item.id];
        if(S.ckFilter==='open'&&isDone)return;
        if(S.ckFilter==='done'&&!isDone)return;
        const txt=getItemText(item);
        const hint=getItemHint(item);
        const unote=getUserNote(item);
        const tc=S.taskContacts[item.id]||null;
        if(q&&!txt.toLowerCase().includes(q)&&!hint.toLowerCase().includes(q)&&!unote.toLowerCase().includes(q)&&!(tc&&(tc.name||'').toLowerCase().includes(q)))return;
        phA++;totalA++;
        if(isDone){phD++;totalD++;}
        const hrs=taskHours(item.id);
        const isGate=sec.gate||item.gate;
        const subs=S.subSteps[item.id]||[];
        const subHtml=subs.length?`<div class="substep-list">${subs.map(ss=>`
          <div class="substep${S.checked[item.id+'_ss_'+ss.id]?' done':''}" id="ss_${item.id}_${ss.id}">
            <div class="ss-cb" onclick="toggleSubStep('${item.id}','${ss.id}')">${S.checked[item.id+'_ss_'+ss.id]?'&#10003;':''}</div>
            <div class="ss-text" onclick="toggleSubStep('${item.id}','${ss.id}')">${esc(ss.text)}</div>
            <button class="ss-edit-btn" onclick="editSubStep('${item.id}','${ss.id}',event)" title="Edit">&#9998;</button>
            <button class="ss-del" onclick="delSubStep('${item.id}','${ss.id}',event)" title="Delete">&#215;</button>
          </div>`).join('')}</div>`:'';
        const contactHtml=tc?`<div class="ci-contact">
          <div class="ci-contact-icon">&#9743;</div>
          <div class="ci-contact-body">
            <span class="ci-contact-name">${esc(tc.name||tc.org||'')}</span>
            ${tc.org&&tc.name?`<span class="ci-contact-sep">&mdash;</span><span class="ci-contact-org">${esc(tc.org)}</span>`:''}
            ${tc.phone?`<span class="ci-contact-phone">&#128222; ${esc(tc.phone)}</span>`:''}
          </div>
          <button class="ia" style="width:20px;height:20px;font-size:10px;flex-shrink:0;" onclick="openTaskNote('${item.id}','${sec.id}',${item._builtin===false})" title="Edit contact">&#9998;</button>
        </div>`:'';
        secHtml+=`<div class="ci${isDone?' done':''}${isGate?' gate-item':''}" id="ci_${item.id}">
          <div class="ci-move">
            <button class="ia-move" onclick="moveItem('${sec.id}','${item.id}',-1)" title="Move up">&#9650;</button>
            <button class="ia-move" onclick="moveItem('${sec.id}','${item.id}',1)" title="Move down">&#9660;</button>
          </div>
          <div class="cb" onclick="toggleCheck('${item.id}')" title="Toggle complete">
            <span class="ck">&#10003;</span>
          </div>
          <div class="ci-body" style="flex:1;min-width:0;">
            <div onclick="toggleCheck('${item.id}')" style="cursor:pointer;">
              ${isGate?'<div class="gate-lbl">GATE ITEM</div>':''}
              <div class="ci-text">${esc(txt)}</div>
              ${hint?`<div class="ci-note">${esc(hint)}</div>`:''}
              ${unote?`<div class="ci-usernote">${esc(unote)}</div>`:''}
              ${hrs>0?`<div class="ci-hours">${hrs.toFixed(2)} hrs logged</div>`:''}
            </div>
            ${contactHtml}
            ${subHtml}
            <div class="add-substep-row" id="asr_${item.id}">
              <input class="add-substep-inp" id="asi_${item.id}" placeholder="New sub-step..." onkeydown="ssKeydown('${item.id}',event)">
              <button class="add-substep-btn" onclick="toggleSubInput('${item.id}',event)">+ sub-step</button>

            <button class="ia${unote?' has-note':''}" onclick="openTaskNote('${item.id}','${sec.id}',${item._builtin===false})" title="Edit note / task">&#9998;</button>
            <button class="ia${hrs>0?' has-log':''}" onclick="logTask('${item.id}')" title="Log time to this task">&#9201;</button>
          </div>
        </div>`
      });
      if(secHtml||!q){
        phHtml+=`<div class="sec-hdr">
          <div class="sec-title">${esc(sec.title)}</div>

function openTaskNote(itemId,secId,isCustom){

  document.getElementById('tnTaskRef').textContent=(found?.phase?.tag||'')+(found?.section?.title?' — '+found.section.title:'');

  document.getElementById('tnCOrg').value=saved.org||'';
  document.getElementById('tnCPhone').value=saved.phone||'';
  document.getElementById('tnCEmail').value=saved.email||'';
  document.getElementById('tnCLink').value=saved.link||'';
  document.getElementById('tnCCat').value=saved.cat||'';
  document.getElementById('tnCSave').checked=!!(saved.name&&!S.taskContacts[itemId]);
  document.getElementById('tnDelBtn').style.display=isCustom?'inline-block':'none';
  document.getElementById('tnDelBtn').setAttribute('data-secid',secId||'');
  openModal('moTaskNote');
}

function saveTaskNote(){
  const id=editTaskId;
  const txt=document.getElementById('tnText').value.trim();
  const hint=document.getElementById('tnHint').value.trim();
  const note=document.getElementById('tnNote').value.trim();
  const found=findItem(id);
  // Text override
  if(found&&txt&&txt!==found.item.text){S.itemNotes[id+'__text']=txt;}
  else{delete S.itemNotes[id+'__text'];}
  S.itemHints[id]=hint;
  if(note){S.itemNotes[id]=note;}else{delete S.itemNotes[id];}
  // Contact
  const cname=document.getElementById('tnCName').value.trim();
  const corg=document.getElementById('tnCOrg').value.trim();
  const cphone=document.getElementById('tnCPhone').value.trim();
  const cemail=document.getElementById('tnCEmail').value.trim();
  const clink=document.getElementById('tnCLink').value.trim();
  const ccat=document.getElementById('tnCCat').value;
  if(cname||corg||cphone||cemail){
    S.taskContacts[id]={name:cname,org:corg,phone:cphone,email:cemail,link:clink,cat:ccat||'Other'};
    if(document.getElementById('tnCSave').checked){
      saveContactFromTask(id,S.taskContacts[id],getItemText(found?.item||{id,text:txt||id}));
    }
  } else {
    delete S.taskContacts[id];
  }
  saveAll();closeModal('moTaskNote');renderChecklist();
}

function deleteCustomTask(){
  const secId=document.getElementById('tnDelBtn').getAttribute('data-secid');
  if(!secId||!editTaskId)return;
  if(!confirm('Delete this custom task?'))return;
  S.customTasks[secId]=(S.customTasks[secId]||[]).filter(t=>t.id!==editTaskId);
  delete S.checked[editTaskId];
  delete S.itemNotes[editTaskId];
  delete S.itemNotes[editTaskId+'__text'];
  delete S.itemHints[editTaskId];
  saveAll();closeModal('moTaskNote');renderChecklist();
}

// Helper: push a contact into contacts section, linked to a task
function saveContactFromTask(taskId,contactData,taskText){
  if(!contactData.name&&!contactData.org)return;
  // Check if contact already exists for this task
  const existing=S.contacts.find(c=>c._taskId===taskId);
  const noteStr='[Task] '+taskText;
  const entry={
    id:existing?existing.id:('tc_'+taskId),
    name:contactData.name||contactData.org||'Unknown',
    org:contactData.org||'',
    cat:contactData.cat||'Other',
    phone:contactData.phone||'',
    email:contactData.email||'',
    link:contactData.link||'',
    notes:noteStr,
    _taskId:taskId
  };
  if(existing){const i=S.contacts.findIndex(c=>c.id===existing.id);if(i>=0)S.contacts[i]=entry;}
  else S.contacts.push(entry);
}

function saveNewTask(){
  const txt=document.getElementById('atText').value.trim();
  if(!txt)return;
  const note=document.getElementById('atNote').value.trim();
  const gate=document.getElementById('atGate').value==='1';
  const id='ct_'+Date.now();
  if(!S.customTasks[editSectionId])S.customTasks[editSectionId]=[];
  S.customTasks[editSectionId].push({id,text:txt,note,gate,_builtin:false});
  // Contact
  const cname=document.getElementById('atCName').value.trim();
  const corg=document.getElementById('atCOrg').value.trim();
  const cphone=document.getElementById('atCPhone').value.trim();
  const cemail=document.getElementById('atCEmail').value.trim();
  const clink=document.getElementById('atCLink').value.trim();

function renderLog(){
  const q=(document.getElementById('logSearch')?.value||'').toLowerCase();
  const cont=document.getElementById('logContainer');

  let entries=[...S.workLog].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(q)entries=entries.filter(e=>(e.description||'').toLowerCase().includes(q)||(e.location||'').toLowerCase().includes(q)||(e.taskText||'').toLowerCase().includes(q)||(e.workType||'').toLowerCase().includes(q));

  // Summary cards
  const tot=S.workLog.reduce((a,e)=>a+(+e.hours||0),0);
  const onsite=S.workLog.filter(e=>(e.location||'').toLowerCase().includes('on-site')||e.workType==='On-site inspection').reduce((a,e)=>a+(+e.hours||0),0);
  const phone=S.workLog.filter(e=>e.workType==='Phone call').reduce((a,e)=>a+(+e.hours||0),0);
  const taskCount=new Set(S.workLog.filter(e=>e.taskId).map(e=>e.taskId)).size;
  document.getElementById('logSummary').innerHTML=`
    <div class="ls-card"><div class="ls-num">${tot.toFixed(1)}</div><div class="ls-lbl">Total Hours</div></div>
    <div class="ls-card"><div class="ls-num">${onsite.toFixed(1)}</div><div class="ls-lbl">On-Site Hours</div></div>
    <div class="ls-card"><div class="ls-num">${phone.toFixed(1)}</div><div class="ls-lbl">Phone Hours</div></div>
    <div class="ls-card"><div class="ls-num">${S.workLog.length}</div><div class="ls-lbl">Log Entries</div></div>
    <div class="ls-card"><div class="ls-num">${taskCount}</div><div class="ls-lbl">Tasks Logged</div></div>
  `;

  if(!entries.length){cont.innerHTML='<div class="empty">NO LOG ENTRIES YET — USE &#9201; ON ANY TASK OR "+ LOG TIME" ABOVE</div>';return;}

  // Group by phase if filter=phase
  if(S.logFilter==='phase'){
    const groups={};
    entries.forEach(e=>{const k=e.phaseTag||'General';if(!groups[k])groups[k]=[];groups[k].push(e);});
    cont.innerHTML=Object.entries(groups).map(([tag,ents])=>{
      const gHrs=ents.reduce((a,e)=>a+(+e.hours||0),0);
      return `<div style="margin-bottom:20px;">
        <div style="font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:2px;color:var(--accent2);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:8px;">${esc(tag)} <span style="color:var(--text-dim);font-size:12px;">${gHrs.toFixed(1)} hrs</span></div>
        ${ents.map(e=>logEntryHtml(e)).join('')}
      </div>`;
    }).join('');
  } else {
    cont.innerHTML=entries.map(e=>logEntryHtml(e)).join('');
  }
}

function logEntryHtml(e){
  return `<div class="log-entry">
    <div class="le-date">${fmtDate(e.date)}</div>
    <div class="le-body">
      ${e.taskText?`<div class="le-task">${esc(e.phaseTag?'['+e.phaseTag+'] ':'')}${esc(e.taskText)}</div>`:'<div class="le-task">— General</div>'}
      ${e.location?`<div class="le-loc">&#9679; ${esc(e.location)}</div>`:''}
      <div class="le-type">${esc(e.workType||'Other')}</div>
      ${e.description?`<div class="le-desc">${esc(e.description)}</div>`:''}
    </div>
    <div style="text-align:right;min-width:50px;">
      <div class="le-hours">${(+e.hours||0).toFixed(2)}h</div>
      <div class="le-acts" style="justify-content:flex-end;margin-top:6px;">
        <button class="btn btn-sm" onclick="editLogEntry('${e.id}')">&#9998;</button>
        <button class="btn btn-sm btn-d" onclick="deleteLogEntry('${e.id}')">&#215;</button>

    </div>
  </div>`;
}

function triggerImport(){
  if(!confirm('Restoring a backup will REPLACE all current data. Continue?'))return;
  document.getElementById('importFile').value='';
  document.getElementById('importFile').click();
}

function importAllData(evt){
  const file=evt.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const parsed=JSON.parse(e.target.result);
      const data=parsed.state||parsed; // support both wrapped and raw
      // Validate basic structure
      if(typeof data!=='object'||Array.isArray(data))throw new Error('Invalid format');
      S={
        checked:data.checked||{},
        itemNotes:data.itemNotes||{},
        itemHints:data.itemHints||{},
        customTasks:data.customTasks||{},
        taskContacts:data.taskContacts||{},
        subSteps:data.subSteps||{},
        itemOrder:data.itemOrder||{},
        workLog:Array.isArray(data.workLog)?data.workLog:[],
        contacts:Array.isArray(data.contacts)&&data.contacts.length?data.contacts:DEFAULT_CONTACTS,
        notes:Array.isArray(data.notes)?data.notes:[],
        ckFilter:'all',logFilter:'all',ccFilter:'all',ntFilter:'all'
      };
      saveAll();
      renderChecklist();renderLog();renderContacts();renderNotes();updateStats();
      alert('Backup restored successfully. '+S.workLog.length+' log entries, '+S.contacts.length+' contacts.');
    }catch(err){
      alert('Could not read backup file: '+err.message);
    }
  };
  reader.readAsText(file);
}

// ──────────────────────────────────────────────────────────────────────────────
// TAX REPORT EXPORT
// ──────────────────────────────────────────────────────────────────────────────
function exportTaxReport(){
  if(!S.workLog.length){alert('No log entries to export.');return;}

  const entries=[...S.workLog].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const totalHrs=entries.reduce((a,e)=>a+(+e.hours||0),0);
  const firstDate=entries[0]?.date||'';
  const lastDate=entries[entries.length-1]?.date||'';

  // ── Aggregations ──────────────────────────────────────────────────────────
  // By work type
  const byType={};
  entries.forEach(e=>{
    const t=e.workType||'Other';
    if(!byType[t])byType[t]={hours:0,count:0};
    byType[t].hours+=(+e.hours||0);byType[t].count++;
  });

  // By phase
  const byPhase={};
  entries.forEach(e=>{
    const p=e.phaseTag||'General';
    if(!byPhase[p])byPhase[p]={hours:0,count:0};
    byPhase[p].hours+=(+e.hours||0);byPhase[p].count++;
  });

  // By month
  const byMonth={};
  entries.forEach(e=>{
    if(!e.date)return;
    const m=e.date.slice(0,7);
    if(!byMonth[m])byMonth[m]={hours:0,entries:[]};
    byMonth[m].hours+=(+e.hours||0);
    byMonth[m].entries.push(e);
  });

  // By quarter
  const byQ={};
  entries.forEach(e=>{
    if(!e.date)return;
    const [yr,mo]=e.date.split('-');
    const q=Math.ceil(parseInt(mo)/3);
    const k=yr+'Q'+q;
    if(!byQ[k])byQ[k]={hours:0,count:0,label:`${yr} Q${q} (${['Jan-Mar','Apr-Jun','Jul-Sep','Oct-Dec'][q-1]})`};
    byQ[k].hours+=(+e.hours||0);byQ[k].count++;
  });

  // On-site hours (IRS material participation — key metric)
  const onsiteHrs=entries.filter(e=>(e.location||'').toLowerCase().includes('on-site')||(e.location||'').toLowerCase().includes('laurel')||e.workType==='On-site inspection').reduce((a,e)=>a+(+e.hours||0),0);
  const phoneHrs=entries.filter(e=>e.workType==='Phone call').reduce((a,e)=>a+(+e.hours||0),0);
  const researchHrs=entries.filter(e=>e.workType==='Research / Review').reduce((a,e)=>a+(+e.hours||0),0);
  const adminHrs=entries.filter(e=>e.workType==='Administrative').reduce((a,e)=>a+(+e.hours||0),0);

  function fmtDt(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});}catch(e){return d;}}
  function row(cells,hdr){
    const tag=hdr?'th':'td';
    return '<tr>'+cells.map(c=>`<${tag} style="${hdr?'background:#1a2a3a;color:#4a9fd4;font-family:monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;':'color:#c8d4dc;font-family:Arial,sans-serif;font-size:12px;'}padding:7px 10px;border:1px solid #2a3038;">${c}</${tag}>`).join('')+'</tr>';
  }

  const typeTableRows=Object.entries(byType).sort((a,b)=>b[1].hours-a[1].hours).map(([t,v])=>row([t,v.count,v.hours.toFixed(2)+' hrs',((v.hours/totalHrs)*100).toFixed(1)+'%']));
  const phaseTableRows=Object.entries(byPhase).sort((a,b)=>b[1].hours-a[1].hours).map(([p,v])=>row([p,v.count,v.hours.toFixed(2)+' hrs',((v.hours/totalHrs)*100).toFixed(1)+'%']));
  const qTableRows=Object.entries(byQ).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>row([v.label,v.count,v.hours.toFixed(2)+' hrs']));

  const monthSections=Object.entries(byMonth).sort((a,b)=>a[0].localeCompare(b[0])).map(([month,data])=>{
    const [yr,mo]=month.split('-');
    const mLabel=new Date(yr,parseInt(mo)-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const entryRows=data.entries.map(e=>row([
      fmtDt(e.date),
      e.hours.toFixed(2)+' h',
      e.location||'—',
      e.workType||'Other',
      e.phaseTag||'—',
      e.taskText||'General',
      e.description||''
    ]));
    return `<div style="margin-bottom:28px;">
      <div style="font-family:monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#c55a11;background:#111416;border-left:3px solid #c55a11;padding:7px 14px;margin-bottom:8px;">
        ${mLabel} &nbsp;&nbsp; <span style="color:#e07030;">${data.hours.toFixed(2)} hrs</span>
      </div>
      <table style="width:100%;border-collapse:collapse;">
        ${row(['Date','Hours','Location','Work Type','Phase','Task','Description'],true)}
        ${entryRows.join('')}
      </table>
    </div>`;
  }).join('');

  const allRows=entries.map(e=>row([
    fmtDt(e.date),e.hours.toFixed(2)+' h',e.location||'—',e.workType||'Other',e.phaseTag||'—',e.taskText||'General',e.description||''
  ]));

  const html=`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Laurel Lane — Material Participation & Hours Log</title>

<body>

  <div class="stat-card"><div class="stat-num">${researchHrs.toFixed(1)}</div><div class="stat-lbl">Research Hours</div></div>

</div>

// ──────────────────────────────────────────────────────────────────────────────
// SUBSTEPS
// ──────────────────────────────────────────────────────────────────────────────
function toggleSubStep(itemId, ssId){
  const key=itemId+'_ss_'+ssId;
  S.checked[key]=!S.checked[key];
  saveAll();renderChecklist();
}

function toggleSubInput(itemId, ev){
  ev.stopPropagation();
  const inp=document.getElementById('asi_'+itemId);
  if(!inp)return;
  if(inp.classList.contains('open')){
    inp.classList.remove('open');inp.value='';
  } else {
    inp.classList.add('open');inp.focus();
  }
}

function ssKeydown(itemId, ev){
  if(ev.key==='Enter'){commitSubStep(itemId);}
  if(ev.key==='Escape'){
    const inp=document.getElementById('asi_'+itemId);
    if(inp){inp.classList.remove('open');inp.value='';}
  }
}

function commitSubStep(itemId){
  const inp=document.getElementById('asi_'+itemId);
  if(!inp)return;
  const txt=inp.value.trim();
  if(!txt)return;
  if(!S.subSteps[itemId])S.subSteps[itemId]=[];
  S.subSteps[itemId].push({id:'ss_'+Date.now(),text:txt});
  saveAll();renderChecklist();
}

function addSubStep(itemId, ev){
  // legacy fallback — not used with new inline UI
  ev.stopPropagation();
  toggleSubInput(itemId, ev);
}

function editSubStep(itemId, ssId, ev){
  ev.stopPropagation();
  const ss=(S.subSteps[itemId]||[]).find(s=>s.id===ssId);
  if(!ss)return;
  const el=document.getElementById('ss_'+itemId+'_'+ssId);
  if(!el)return;
  // Replace substep row with inline edit
  const orig=el.outerHTML;
  el.innerHTML=`
    <div class="ss-inline-edit" style="display:flex;gap:4px;flex:1;">
      <input class="ss-inline-input" id="sse_${ssId}" value="${esc(ss.text)}" onkeydown="ssEditKey('${itemId}','${ssId}',event)">
      <button class="ss-inline-save" onclick="saveSubEdit('${itemId}','${ssId}')">OK</button>
      <button class="ss-inline-cancel" onclick="renderChecklist()">&#215;</button>
    </div>`;
  el.style.padding='0';
  const inp=document.getElementById('sse_'+ssId);
  if(inp){inp.focus();inp.select();}
}

function ssEditKey(itemId, ssId, ev){
  if(ev.key==='Enter')saveSubEdit(itemId,ssId);
  if(ev.key==='Escape')renderChecklist();
}

function saveSubEdit(itemId, ssId){
  const inp=document.getElementById('sse_'+ssId);
  if(!inp)return;
  const txt=inp.value.trim();
  if(!txt){renderChecklist();return;}
  const arr=S.subSteps[itemId]||[];
  const i=arr.findIndex(s=>s.id===ssId);
  if(i>=0)arr[i].text=txt;
  saveAll();renderChecklist();
}

function delSubStep(itemId, ssId, ev){
  ev.stopPropagation();
  S.subSteps[itemId]=(S.subSteps[itemId]||[]).filter(s=>s.id!==ssId);
  delete S.checked[itemId+'_ss_'+ssId];
  saveAll();renderChecklist();
}

// ──────────────────────────────────────────────────────────────────────────────
// THEME
// ──────────────────────────────────────────────────────────────────────────────
function applyTheme(theme){
  const isLight = theme === 'light';
  document.documentElement.classList.toggle('light', isLight);
  const btn = document.getElementById('themeBtn');
  if(btn){
    btn.textContent = isLight ? '🌙 DARK' : '☀ LIGHT';
    btn.title = isLight ? 'Switch to dark theme' : 'Switch to light theme';
  }
  try{localStorage.setItem('ll_theme', theme);}catch(e){}
}

function toggleTheme(){
  const isLight = document.documentElement.classList.contains('light');
  applyTheme(isLight ? 'dark' : 'light');
}

function loadTheme(){
  try{
    const saved = localStorage.getItem('ll_theme');
    applyTheme(saved === 'light' ? 'light' : 'dark');
  }catch(e){ applyTheme('dark'); }
}

// ──────────────────────────────────────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────────────────────────────────────
loadAll();
loadTheme();
renderChecklist();
updateStats();
</script>
</body>
</html>
